<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Bubblesort">
  <!--
    Five bars of descending length against the ledger spine: the board itself,
    reduced until only the ranking is left. Ink on paper, the same two values
    the game uses, and nothing that needs a second colour.
  -->
  <rect width="32" height="32" fill="#E7E9EC"/>
  <rect x="9" y="5" width="1" height="22" fill="#CDCFD2"/>
  <g fill="#24405A">
    <rect x="12" y="6"  width="15" height="2.6"/>
    <rect x="12" y="11" width="12" height="2.6"/>
    <rect x="12" y="16" width="9"  height="2.6"/>
    <rect x="12" y="21" width="6"  height="2.6"/>
  </g>
</svg>
